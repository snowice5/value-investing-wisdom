<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>價值投資智慧</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="wisdom-panel" aria-labelledby="page-title">
        <a class="language-link" href="index.html" aria-label="切換到英文版">English</a>

        <div class="intro">
          <p class="kicker">巴菲特爺爺啟發的價值投資</p>
          <h1 id="page-title">價值投資智慧</h1>
          <p class="subtitle">
            點一下價值投資大神，抽一句經典投資名言。
          </p>
        </div>

        <button class="figure-button" id="figureButton" type="button" aria-label="顯示一句投資名言">
          <span class="figure-glow" aria-hidden="true"></span>
          <img
            src="Value investing BLDR1.png"
            alt="巴菲特爺爺啟發的樂高風格投資公仔"
            class="figure-image"
          />
        </button>

        <aside class="quote-card" id="quoteCard" aria-live="polite">
          <span class="quote-mark quote-mark-open" aria-hidden="true">&ldquo;</span>
          <p id="quoteText">偉大的投資，從耐心開始。</p>
          <p id="quoteSource">點一下價值投資大神開始</p>
          <span class="quote-mark quote-mark-close" aria-hidden="true">&rdquo;</span>
        </aside>

      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
